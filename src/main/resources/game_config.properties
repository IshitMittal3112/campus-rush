# Campus Rush Game Configuration
game.title=Campus Rush - University Survival Challenge

# ---- Clock (SIMULATED: time only advances when a player acts - no threads, no real-time ticking) ----
game.startTime=09:00
game.durationMinutes=480
# Minutes of game time a "Wait" action costs
game.waitMinutes=5

# ---- Scoring (per the design table) ----
game.score.onTimeBonus=20
game.score.hurdleSolved=10
game.score.shortcut=5
game.score.firstArrival=10

# ---- Hurdles ----
# Average delay used by the "safest route" planner to price a hurdle
game.hurdle.expectedDelayMinutes=4
# Chance that a triggered hurdle is a keyboard-reflex task instead of a quiz (GUI only)
game.hurdle.reflexChance=0.35
# Seconds the player has to answer a quiz hurdle
game.hurdle.quizSeconds=15

# ---- Character tuning (each class differs by ONE number) ----
game.speedMultiplier.sprinter=1.2
game.hurdleChanceMultiplier.negotiator=0.70
game.hurdleBonusMultiplier.scholar=2.0

# Ability charges at the start of a game
game.abilityCharges=2

# Seed for reproducible games (0 = random)
game.randomSeed=0
